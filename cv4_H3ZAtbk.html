<!-- Googleアナリティクス（GA4） -->
<script>
  var GA_ID = 'G-QDD5VCFLEY';   // ← 測定ID
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  if (GA_ID.indexOf('XXXX') < 0) {
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    gtag('js', new Date()); gtag('config', GA_ID);
  }
</script>

<body>
<div class="box" id="app"></div>
<div class="note">このページはGoogleアナリティクスでクリック数を数えています</div>
<script>
// ── 自分版URLgenius ──
// 短いリンク：foodojo.link/動画ID（11文字）や foodojo.link/@チャンネル → YouTubeアプリを開く
// 好きな名前も使える：下の LINKS に「名前: 動画ID」を足すと foodojo.link/名前 で開く
// 何もない foodojo.link → YouTubeのURLを貼ると短いリンクを作る画面
var LINKS = {
  // 'mirior': '動画ID',
};
(function () {
  var app = document.getElementById('app');
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua);
  var device = isIOS ? 'iphone' : isAndroid ? 'android' : 'pc';

  // 開くもの（動画 or チャンネル）を決める
  var slug = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, ''));
  var q = new URLSearchParams(location.search);
  var v = q.get('v'), c = q.get('c');            // 古い形 ?v= ?c= もそのまま使える
  if (!v && !c && slug) {
    if (LINKS[slug.toLowerCase()]) v = LINKS[slug.toLowerCase()];
    else if (/^[\w-]{11}$/.test(slug)) v = slug;
    else if (/^@[\w.\-]+$/.test(slug)) c = slug;
  }

  function track(name, params, done) {          // Googleに送り終わってから移動（最大1.5秒待つ）
    var called = false;
    function go() { if (!called) { called = true; if (done) done(); } }
    params.transport_type = 'beacon';
    params.event_callback = go;
    gtag('event', name, params);
    setTimeout(go, 1500);
  }

  if (v || c) {
    var path = v ? 'watch?v=' + encodeURIComponent(v) : encodeURIComponent(c).replace('%40', '@');
    var web = 'https://www.youtube.com/' + path;
    var info = { link: slug || (v || c), video: v || c, device: device };
    var appUrl;
    if (isAndroid) {
      appUrl = 'intent://www.youtube.com/' + path +
        '#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=' +
        encodeURIComponent(web) + ';end';
    } else if (isIOS) {
      appUrl = 'youtube://www.youtube.com/' + path;
    } else {
      track('open_link', info, function () { location.replace(web); });   // パソコンはそのままYouTubeへ
      return;
    }
    app.innerHTML =
      '<h1>FOODOJO ▶ YouTube</h1>' +
      '<p>YouTubeアプリを開いています…<br>開かない時は下のボタンを押してください</p>' +
      '<a class="btn" id="appbtn" href="' + appUrl + '">YouTubeアプリで見る</a>' +
      '<a class="sub" id="webbtn" href="' + web + '">ブラウザで見る</a>';
    document.getElementById('appbtn').addEventListener('click', function () {
      gtag('event', 'tap_app_button', { link: info.link, video: info.video, device: device, transport_type: 'beacon' });
    });
    document.getElementById('webbtn').addEventListener('click', function () {
      gtag('event', 'tap_browser_button', { link: info.link, video: info.video, device: device, transport_type: 'beacon' });
    });
    track('open_link', info, function () {
      location.href = appUrl;                     // まず自動で開く
      if (isIOS) {                                // iPhoneで開かなかった時はブラウザへ
        var t = setTimeout(function () { if (!document.hidden) location.href = web; }, 2500);
        document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); });
      }
    });
    return;
  }

  // ── 短いリンクを作る画面 ──
  app.innerHTML =
    '<h1>YouTubeアプリで開く短いリンクを作る</h1>' +
    '<p>YouTubeの動画・ショート・チャンネルのURLを貼ってください</p>' +
    '<input id="u" placeholder="https://youtu.be/xxxx や https://www.youtube.com/@foodojo">' +
    '<div class="out" id="o">ここに短いリンクが出ます</div>' +
    '<button id="b">コピー</button>' +
    '<div class="hint">できたリンクをManychatのDMやプロフィールに貼ってください。<br>まず自分のスマホで、インスタのDMからタップして試してね。</div>';
  var base = location.origin + '/';
  function make(s) {
    s = s.trim(); var m;
    if ((m = s.match(/(?:youtu\.be\/|v=|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/))) return base + m[1];
    if ((m = s.match(/youtube\.com\/(@[\w.\-]+)/))) return base + m[1];
    if ((m = s.match(/^[\w-]{11}$/))) return base + m[0];
    return '';
  }
  var u = document.getElementById('u'), o = document.getElementById('o');
  u.addEventListener('input', function () { o.textContent = make(u.value) || 'YouTubeのURLを貼ってください'; });
  document.getElementById('b').addEventListener('click', function () {
    var link = make(u.value); if (!link) return;
    navigator.clipboard.writeText(link).then(function () { document.getElementById('b').textContent = 'コピーしました！'; });
  });
})();
</script>
</body>
