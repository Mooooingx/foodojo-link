name: build video pages
on:
  schedule:
    - cron: '*/5 * * * *'   # 5分ごと
  workflow_dispatch:
  push:
    paths: ['index.html', 'ids.txt', 'links.txt', 'build_pages.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_pages.py
      - run: |
          git config user.name "foodojo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add video pages" && git push)
